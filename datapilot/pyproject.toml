[project]
name = "datapilot"
version = "0.1.0"
description = "DataPilot foundation API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "sqlalchemy==2.0.48",
  "alembic==1.18.4",
  "psycopg[binary]==3.3.3",
  "redis==7.3.0",
  "celery==5.6.2",
  "boto3==1.42.65",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "openpyxl==3.1.5",
  "pyarrow==26.0.0",
  "defusedxml==0.7.1",
  "cryptography>=46,<47",
]
[dependency-groups]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.15.5", "mypy==1.19.1", "pyyaml==6.0.3"]
[tool.pytest.ini_options]
pythonpath = ["services/api", "services/worker"]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
python_version = "3.12"
files = ["services/api", "services/worker"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
