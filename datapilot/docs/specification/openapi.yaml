components:
  securitySchemes:
    OIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Issuer/audience/expiry verified with provider JWKS; org roles enforced server side.
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    UserContext:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        organization_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - analyst
          - viewer
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        locale:
          type: string
    PresignRequest:
      type: object
      required:
      - filename
      - size_bytes
      - content_type
      properties:
        filename:
          type: string
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 26214400
        content_type:
          type: string
          enum:
          - text/csv
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
    PresignResponse:
      type: object
      required:
      - upload_id
      - url
      - expires_at
      properties:
        upload_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        method:
          type: string
          const: PUT
    FinalizeUploadRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        worksheet_name:
          type:
          - string
          - 'null'
    Dataset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - uploaded
          - validating
          - profiling
          - ready
          - failed
        latest_version_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
    JobAccepted:
      type: object
      required:
      - job_id
      - status
      - status_url
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
        status_url:
          type: string
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
    Column:
      type: object
      required:
      - name
      - inferred_type
      properties:
        name:
          type: string
        inferred_type:
          type: string
        null_count:
          type: integer
          minimum: 0
        semantic_role:
          type:
          - string
          - 'null'
    Preview:
      type: object
      properties:
        dataset_version_id:
          type: string
          format: uuid
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type:
              - string
              - number
              - integer
              - boolean
              - 'null'
        offset:
          type: integer
        limit:
          type: integer
        total_rows:
          type: integer
    QualityFinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rule_code:
          type: string
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
        column_name:
          type:
          - string
          - 'null'
        affected_rows:
          type: integer
          minimum: 0
        details:
          type: object
    QualityReport:
      type: object
      properties:
        dataset_version_id:
          type: string
          format: uuid
        findings:
          type: array
          items:
            $ref: '#/components/schemas/QualityFinding'
    SemanticMapping:
      type: object
      required:
      - dataset_version_id
      - fields
      properties:
        dataset_version_id:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties:
            type: string
          description: Role -> dataset column; server checks column/role mapping against detected schema.
        currency:
          type:
          - string
          - 'null'
        timezone:
          type: string
          default: UTC
    CleaningOperation:
      type: object
      required:
      - kind
      - column
      properties:
        kind:
          type: string
          enum:
          - drop_exact_duplicates
          - trim_string
          - normalize_date
          - fill_missing_constant
          - fill_missing_median
          - cast_type
          - map_category
        column:
          type: string
        args:
          type: object
          description: Validated per-operation args. User-provided expressions are prohibited.
    CleaningPlanRequest:
      type: object
      required:
      - dataset_version_id
      - operations
      properties:
        dataset_version_id:
          type: string
          format: uuid
        operations:
          type: array
          items:
            $ref: '#/components/schemas/CleaningOperation'
          minItems: 1
    CleaningPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - proposed
          - approved
          - applied
          - rejected
          - failed
        preview:
          type:
          - object
          - 'null'
        new_version_id:
          type:
          - string
          - 'null'
          format: uuid
    AnalysisRequest:
      type: object
      required:
      - dataset_version_id
      properties:
        dataset_version_id:
          type: string
          format: uuid
        question:
          type:
          - string
          - 'null'
        template_id:
          type:
          - string
          - 'null'
          enum:
          - sales_overview
          - product_performance
          - region_performance
          - null
    Analysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dataset_version_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        metrics:
          type: object
        result:
          type: object
        evidence:
          type: object
    Insight:
      type: object
      required:
      - statement
      - evidence_ids
      properties:
        statement:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
    InsightList:
      type: object
      properties:
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
    QuestionRequest:
      type: object
      required:
      - dataset_version_id
      - question
      properties:
        dataset_version_id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 3
          maxLength: 1200
        conversation_id:
          type:
          - string
          - 'null'
          format: uuid
    QuestionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        answer:
          type:
          - string
          - 'null'
        analysis_id:
          type:
          - string
          - 'null'
          format: uuid
        evidence:
          type:
          - object
          - 'null'
    DashboardCreate:
      type: object
      required:
      - analysis_id
      - title
      - spec
      properties:
        analysis_id:
          type: string
          format: uuid
        title:
          type: string
        spec:
          type: object
    Dashboard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        analysis_id:
          type: string
          format: uuid
        spec:
          type: object
    OutputRequest:
      type: object
      required:
      - analysis_id
      properties:
        analysis_id:
          type: string
          format: uuid
    DownloadLink:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    DatasetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        next_cursor:
          type:
          - string
          - 'null'
